<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .badge-status { font-size: 0.9rem; padding: 0.5em 0.8em; }
        .attendance-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .attendance-form { margin-bottom: 30px; }
        .month-selector { margin-bottom: 20px; }
    </style>
</head>
<body class="container mt-4">

<div class="attendance-header">
    <h2>📅 Attendance</h2>
    <a href="/worker/dashboard" class="btn btn-secondary">⬅ Back to Dashboard</a>
</div>

<!-- Mark Today’s Attendance -->
<div class="card attendance-form p-3 mb-4">
    <h5>Mark Today’s Attendance</h5>
    <form th:action="@{/worker/attendance/mark}" method="post" class="row g-3 align-items-center">
        <div class="col-auto">
            <select name="status" class="form-select" required>
                <option value="">Select Status</option>
                <option value="Present" th:selected="${todayAttendance != null && todayAttendance.status == 'Present'}">Present</option>
                <option value="Absent" th:selected="${todayAttendance != null && todayAttendance.status == 'Absent'}">Absent</option>
                <option value="Leave" th:selected="${todayAttendance != null && todayAttendance.status == 'Leave'}">Leave</option>
            </select>
        </div>
        <div class="col-auto">
            <input type="text" name="remarks" class="form-control" placeholder="Remarks"
                   th:value="${todayAttendance != null ? todayAttendance.remarks : ''}">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>
</div>

<!-- Month/Year Selector -->
<div class="card month-selector p-3 mb-4">
    <h5>View Monthly Attendance</h5>
    <form method="get" class="row g-3 align-items-center">
        <div class="col-auto">
            <label for="month" class="form-label">Month</label>
            <select name="month" id="month" class="form-select">
                <option th:each="m : ${#numbers.sequence(1,12)}"
                        th:value="${m}" th:text="${m}" th:selected="${m == month}">1</option>
            </select>
        </div>
        <div class="col-auto">
            <label for="year" class="form-label">Year</label>
            <select name="year" id="year" class="form-select">
                <option th:each="y : ${#numbers.sequence(2023, 2050)}"
                        th:value="${y}" th:text="${y}" th:selected="${y == year}">2026</option>
            </select>
        </div>
        <div class="col-auto mt-4">
            <button type="submit" class="btn btn-info">View</button>
        </div>
    </form>
</div>

<!-- Monthly Attendance Table -->
<div class="card p-3">
    <h5>Monthly Attendance (<span th:text="${month} + '/' + ${year}"></span>)</h5>
    <div class="table-responsive">
        <table class="table table-bordered text-center">
            <thead class="table-dark">
                <tr>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Remarks</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="a : ${monthlyAttendance}">
                    <td th:text="${#temporals.format(a.attendanceDate, 'dd-MM-yyyy')}"></td>
                    <td>
                        <span th:switch="${a.status}">
                            <span th:case="'Present'" class="badge bg-success badge-status">🟢 Present</span>
                            <span th:case="'Absent'" class="badge bg-danger badge-status">🔴 Absent</span>
                            <span th:case="'Leave'" class="badge bg-warning text-dark badge-status">🟡 Leave</span>
                        </span>
                    </td>
                    <td th:text="${a.remarks}">-</td>
                </tr>
                <tr th:if="${#lists.isEmpty(monthlyAttendance)}">
                    <td colspan="3" class="text-center text-danger">No attendance records</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
