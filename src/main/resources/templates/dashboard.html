<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Worker Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Header */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn-logout {
            background-color: #dc3545;
            color: #fff;
            font-weight: 600;
        }

        /* Summary cards */
        .card-summary {
            background: linear-gradient(135deg, #ffffff, #f8f9ff);
            border-left: 6px solid #0d6efd;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
            border-radius: 14px;
            padding: 22px;
            text-align: center;
            height: 100%;
        }

        .card-summary:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 28px rgba(0,0,0,0.14);
        }

        .card-summary h5 {
            font-weight: 600;
            color: #555;
            margin-bottom: 10px;
        }

        .value {
            font-size: 2.3rem;
            font-weight: 800;
            color: #0d6efd;
        }

        .card-summary p {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #666;
        }

        /* Quick menu */
        .quick-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 18px;
            margin-bottom: 40px;
        }

        .quick-menu a {
            background: #ffffff;
            border-radius: 14px;
            padding: 22px;
            text-decoration: none;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #000;
            transition: all 0.25s ease;
        }

        .quick-menu a:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 30px rgba(0,0,0,0.15);
            color: #0d6efd;
        }

        .quick-menu i {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #0d6efd;
        }

        /* Attendance badge */
        .badge-status {
            font-size: 1rem;
            padding: 6px 14px;
        }

        /* Table */
        .recent-trips table {
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
        }
    </style>
</head>

<body class="container mt-4">

<!-- Header -->
<div class="dashboard-header">
    <h2>👷‍♂️ Welcome, <span th:text="${workerName}">Worker</span></h2>
    <a href="/logout" class="btn btn-logout">🚪 Logout</a>
</div>

<!-- Summary Cards -->
<div class="row g-4 mb-4">

    <div class="col-sm-6 col-md-3">
        <div class="card-summary">
            <h5>Trips Today</h5>
            <div class="value" th:text="${totalTrips}">0</div>
        </div>
    </div>

    <div class="col-sm-6 col-md-3">
        <div class="card-summary">
            <h5>Distance (KM)</h5>
            <div class="value" th:text="${totalDistance}">0</div>
        </div>
    </div>

    <div class="col-sm-6 col-md-3">
        <div class="card-summary">
            <h5>Income Today (Rs.)</h5>
            <div class="value" th:text="${totalIncome}">0</div>
        </div>
    </div>

    <div class="col-sm-6 col-md-3">
        <div class="card-summary">
            <h5>Attendance Today</h5>
            <div class="mt-2">
                <span th:switch="${attendanceStatus}">
                    <span th:case="'Present'" class="badge bg-success badge-status">🟢 Present</span>
                    <span th:case="'Absent'" class="badge bg-danger badge-status">🔴 Absent</span>
                    <span th:case="'Leave'" class="badge bg-warning text-dark badge-status">🟡 Leave</span>
                    <span th:case="*">❓ Unknown</span>
                </span>
            </div>
            <p>
                🗓 <strong th:text="${monthlyPresentDays}">0</strong> /
                <span th:text="${monthlyTotalDays}">30</span> days present
            </p>
        </div>
    </div>

</div>

<!-- Quick Menu -->
<div class="quick-menu">
    <a href="/worker/trip"><i class="bi bi-plus-circle"></i>Add Trip</a>
    <a href="/worker/triphistory"><i class="bi bi-bar-chart"></i>Trip History</a>
    <a href="/worker/attendance"><i class="bi bi-calendar-check"></i>Attendance</a>
    <a href="/worker/salary"><i class="bi bi-cash-stack"></i>Salary</a>
</div>

<!-- Recent Trips -->
<div class="recent-trips">
    <h4 class="mb-3">📝 Recent Trips</h4>
    <div class="table-responsive">
        <table class="table table-striped table-bordered text-center">
            <thead class="table-dark">
            <tr>
                <th>Date</th>
                <th>Vehicle</th>
                <th>Material</th>
                <th>Qty</th>
                <th>From</th>
                <th>To</th>
                <th>KM</th>
                <th>Income</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${recentTrips}">
                <td th:text="${#temporals.format(t.tripDate, 'dd-MM-yyyy')}"></td>
                <td th:text="${t.vehicleNo}"></td>
                <td th:text="${t.materialType}"></td>
                <td th:text="${t.materialQuantity}"></td>
                <td th:text="${t.fromLocation}"></td>
                <td th:text="${t.toLocation}"></td>
                <td th:text="${t.distanceKm}"></td>
                <td th:text="${t.tripIncome}"></td>
                <td>
                    <a th:href="@{/worker/trip/edit/{id}(id=${t.tripId})}"
                       class="btn btn-sm btn-warning">Edit</a>
                    <a th:href="@{/worker/trip/delete/{id}(id=${t.tripId})}"
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('Delete this trip?')">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(recentTrips)}">
                <td colspan="9" class="text-danger">No trips found</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
