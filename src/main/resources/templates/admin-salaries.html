<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Salaries</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://sdk.cashfree.com/js/v1/cashfree.pg.js"></script>
    
</head>
<body class="container mt-4">

<h2>💰 Salary Management</h2>
<a href="/admin/dashboard" class="btn btn-secondary mb-3">⬅ Back Dashboard</a>

<!-- ================= ERROR MESSAGE ================= -->
<div th:if="${param.error == 'exists'}" class="alert alert-danger">
    ⚠️ Salary for this worker and month already exists!
</div>

<!-- ================= ADD / UPDATE SALARY ================= -->
<h4>Add / Update Salary</h4>
<form th:action="@{/admin/salary/create}" method="post" class="row g-3 mb-4">

    <div class="col-md-3">
        <label>Worker</label>
        <select name="workerId" id="workerSelect" class="form-control" required>
            <option value="" disabled selected>Select Worker</option>
            <option th:each="w : ${workers}"
                    th:value="${w.workerId}"
                    th:text="${w.workerName}">
            </option>
        </select>
    </div>

    <div class="col-md-2">
        <label>Salary Month</label>
        <input type="month" name="salaryMonth" id="salaryMonth" class="form-control" required
               th:value="${currentMonth}" >
    </div>

    <div class="col-md-2">
        <label>Base Salary</label>
        <input type="number" name="baseSalary" id="baseSalary" class="form-control"
               value="21000" readonly>
    </div>

    <div class="col-md-1">
        <label>OT Hrs</label>
        <input type="number" step="0.5" name="overtimeHours" id="otHours" class="form-control" value="0">
    </div>

    <div class="col-md-1">
        <label>OT Rate</label>
        <input type="number" name="overtimeRate" id="otRate" class="form-control" value="100" readonly>
    </div>

    <div class="col-md-1">
        <label>OT Pay</label>
        <input type="number" id="otPay" class="form-control" value="0" readonly>
    </div>

    <div class="col-md-1">
        <label>Advance</label>
        <input type="number" step="0.01" name="advance" id="advance" class="form-control" value="0">
    </div>

    <div class="col-md-2">
        <label>Total</label>
        <input type="number" id="totalAmount" class="form-control" value="21000" readonly>
    </div>

    <div class="col-md-12">
        <button type="submit" class="btn btn-success mt-2">Save Salary</button>
    </div>
</form>

<!-- ================= GENERATE MONTHLY ================= -->
<form th:action="@{/admin/salary/generate-monthly}" method="post" class="mb-3">
    <button class="btn btn-warning">Generate Monthly Salary</button>
</form>

<!-- ================= SALARY TABLE ================= -->
<table class="table table-striped">
    <thead>
    <tr>
        <th>Worker</th>
        <th>Month</th>
        <th>Base</th>
        <th>OT Hrs</th>
        <th>OT Rate</th>
        <th>OT Pay</th>
        <th>Advance</th>
        <th>Total</th>
        <th>Status</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="salary : ${allSalaries}">
        <td th:text="${workerNameById[salary.workerId]}">Worker</td>
        <td th:text="${salary.salaryMonth}">2026-01</td>
        <td th:text="${salary.baseSalary}">21000</td>
        <td th:text="${salary.overtimeHours}">0</td>
        <td th:text="${salary.overtimeRate}">100</td>
        <td th:text="${salary.overtimePay}">0</td>
        <td th:text="${salary.advance}">0</td>
        <td th:text="${salary.amount}">21000</td>
        <td th:text="${salary.status}">Unpaid</td>
        <td>
            <form th:if="${salary.status == 'Unpaid'}"
                  th:action="@{'/admin/salary/pay/' + ${salary.salaryId}}"
                  method="post">
                <button class="btn btn-success btn-sm">Pay 💵</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<!-- ================= JS ================= -->
<script>
    const workerSelect = document.getElementById("workerSelect");
    const salaryMonthInput = document.getElementById("salaryMonth");
    const otHoursInput = document.getElementById("otHours");
    const otRateInput = document.getElementById("otRate");
    const otPayInput = document.getElementById("otPay");
    const advanceInput = document.getElementById("advance");
    const totalInput = document.getElementById("totalAmount");
    const baseSalaryInput = document.getElementById("baseSalary");

    let currentOtPay = 0;

    function calculateTotal() {
        const baseSalary = parseFloat(baseSalaryInput.value) || 0;
        const advance = parseFloat(advanceInput.value) || 0;
        totalInput.value = baseSalary + currentOtPay - advance;
    }

    // Update OT Pay
    otHoursInput.addEventListener("input", () => {
        const otHours = parseFloat(otHoursInput.value) || 0;
        const otRate = parseFloat(otRateInput.value) || 0;
        currentOtPay = otHours * otRate;
        otPayInput.value = currentOtPay;
        calculateTotal();
    });

    // Update total when Advance changes
    advanceInput.addEventListener("input", calculateTotal);

    // Auto-fill existing salary on worker/month change
    async function fetchSalary(workerId, month) {
        if (!workerId || !month) return;

        // Fetch salary from backend API
        const url = `/admin/salary/fetch?workerId=${workerId}&salaryMonth=${month}`;
        const response = await fetch(url);
        if (response.ok) {
            const data = await response.json();
            otHoursInput.value = data.overtimeHours || 0;
            otRateInput.value = data.overtimeRate || 100;
            otPayInput.value = data.overtimePay || 0;
            currentOtPay = data.overtimePay || 0;
            advanceInput.value = data.advance || 0;
            calculateTotal();
        }
    }

    workerSelect.addEventListener("change", () => {
        fetchSalary(workerSelect.value, salaryMonthInput.value);
    });

    salaryMonthInput.addEventListener("change", () => {
        fetchSalary(workerSelect.value, salaryMonthInput.value);
    });

    // Initial calculation
    calculateTotal();
</script>

</body>
</html>
