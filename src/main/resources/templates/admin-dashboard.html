<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(135deg, #f4f6f9, #e2e8f0);
            min-height: 100vh; 
        }
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .card-summary {
            border-radius: 15px;
            padding: 25px;
            color: #fff;
            position: relative;
            overflow: hidden;
            min-height: 140px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card-summary:hover {
            transform: translateY(-7px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        .card-summary h3 { font-weight: 700; margin-top: 10px; }
        .card-summary i {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 3rem;
            opacity: 0.2;
        }
        .bg-workers { background: linear-gradient(135deg, #0d6efd, #6c5ce7); }
        .bg-trips { background: linear-gradient(135deg, #20c997, #12b886); }
        .bg-present { background: linear-gradient(135deg, #fd7e14, #f59f00); }
        .bg-salaries { background: linear-gradient(135deg, #dc3545, #e64980); }

        .action-buttons a {
            font-size: 1.1rem;
            font-weight: 600;
            padding: 12px 25px;
            border-radius: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .action-buttons a:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-decoration: none;
        }
        .section-title {
            font-weight: 700;
            margin-bottom: 20px;
            font-size: 1.6rem;
            color: #333;
        }
    </style>
</head>
<body class="container mt-5">

<!-- Header -->
<div class="dashboard-header">
    <h2>👷‍♂️ Admin Dashboard</h2>
    <a href="/logout" class="btn btn-danger"><i class="fa fa-sign-out-alt"></i> Logout</a>
</div>

<!-- Dashboard Cards -->
<h4 class="section-title">Quick Stats</h4>
<div class="row g-4">
    <div class="col-sm-6 col-md-3">
        <div class="card-summary bg-workers">
            <i class="fa fa-users"></i>
            <h5>Total Workers</h5>
            <h3 th:text="${totalWorkers}">0</h3>
        </div>
    </div>
    <div class="col-sm-6 col-md-3">
        <div class="card-summary bg-trips">
            <i class="fa fa-truck"></i>
            <h5>Trips Today</h5>
            <h3 th:text="${totalTripsToday}">0</h3>
        </div>
    </div>
    <div class="col-sm-6 col-md-3">
        <div class="card-summary bg-present">
            <i class="fa fa-user-check"></i>
            <h5>Workers Present</h5>
            <h3 th:text="${workersPresentToday}">0</h3>
        </div>
    </div>
    <div class="col-sm-6 col-md-3">
        <div class="card-summary bg-salaries">
            <i class="fa fa-money-bill-wave"></i>
            <h5>Salaries Pending</h5>
            <h3 th:text="${totalSalariesPending}">0</h3>
        </div>
    </div>
</div>

<!-- Quick Action Buttons -->
<h4 class="section-title mt-5">Quick Actions</h4>
<div class="action-buttons d-flex flex-wrap gap-3">
    <a href="/admin/workers" class="btn btn-primary">
        <i class="fa fa-users"></i> Workers List
    </a>
    <a href="/admin/salaries" class="btn btn-success">
        <i class="fa fa-money-bill-wave"></i> Salaries
    </a>
   
</div>

</body>
</html>
